[project]
name = "mcp-cronos"
version = "1.5.0"
description = "MCP server for structured daily work diary management with i18n support"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Maurizio Mocci", email = "mauriziomocci@gmail.com"}
]
keywords = ["mcp", "cronos", "diary", "standup", "markdown", "work-log"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "Natural Language :: Italian",
]
dependencies = [
    "holidays>=0.98",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mauriziomocci/mcp-cronos"
Repository = "https://github.com/mauriziomocci/mcp-cronos"
Issues = "https://github.com/mauriziomocci/mcp-cronos/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cronos"]

[project.scripts]
mcp-cronos = "mcp_cronos.server:run"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
