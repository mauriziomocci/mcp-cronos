[project]
name = "mcp-cronos"
version = "0.1.0"
description = "MCP Server per la gestione del diario di lavoro giornaliero"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Maurizio Mocci", email = "maurizio.mocci@example.com"}
]
keywords = ["mcp", "cronos", "diario", "standup", "markdown"]
license = {text = "MIT"}

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cronos"]

[project.scripts]
mcp-cronos = "mcp_cronos.server:run"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
